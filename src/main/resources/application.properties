spring.application.name=lab09-api
server.port=8080

# ---------- H2 (en memoria) ----------
spring.datasource.url=jdbc:h2:mem:lab09db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ---------- Hibernate crea las tablas a partir de las clases @Entity ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
app.jwt.secret=lab09-clave-secreta-para-firmar-tokens-jwt-2026
app.jwt.expiracion-minutos=60
